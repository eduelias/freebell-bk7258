# Doorbell BK7258 (custom firmware): Home Assistant package.
# Copy to /config/packages/doorbell_bk7258.yaml (configuration.yaml: homeassistant: packages: !include_dir_named packages).
# Replace <your_phone>, <device-ip> and <ha-ip>, then check the configuration and reload (rest_command / shell_command /
# automation / template all have reload services in HA 2026.9; a restart also works).
# fw 0.25 additions: rest_command.doorbell_cmd (needs `doorbell_cmd_url` in secrets.yaml, see below), the policy file
# writer (shell_command.doorbell_policy_write + /config/doorbell_policy.py + the seven input helpers) and the
# "Doorbell BK7258 policy" sensor.
#
# Notification group: add/remove phones here (the webhook automation and the low-battery automation use it).
notify:
  - platform: group
    name: doorbell_family
    services:
      - action: mobile_app_<your_phone>
      - action: mobile_app_<your_second_phone>

# feat/power (fw 0.21.0): trigger-based sensors fed by event doorbell_bk7258_report (fan-out from the webhook automation)
template:
  - trigger:
      - trigger: event
        event_type: doorbell_bk7258_report
    sensor:
      - name: Doorbell BK7258 battery
        unique_id: doorbell_bk7258_battery_pct
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: "{{ trigger.event.data.batt_pct if trigger.event.data.batt_pct is not none else this.state }}"
      - name: Doorbell BK7258 battery voltage
        unique_id: doorbell_bk7258_battery_mv
        unit_of_measurement: mV
        device_class: voltage
        state_class: measurement
        state: "{{ trigger.event.data.batt_mv if trigger.event.data.batt_mv is not none else this.state }}"
      - name: Doorbell BK7258 light level
        unique_id: doorbell_bk7258_light_mv
        unit_of_measurement: mV
        state_class: measurement
        state: "{{ trigger.event.data.light_mv }}"
      - name: Doorbell BK7258 last event
        unique_id: doorbell_bk7258_last_event
        state: "{{ trigger.event.data.event }}"
        attributes:
          reason: "{{ trigger.event.data.reason }}"
          fw: "{{ trigger.event.data.fw }}"
          ip: "{{ trigger.event.data.ip }}"
          uptime_s: "{{ trigger.event.data.uptime_s }}"
      - name: Doorbell BK7258 policy
        # fw 0.25: result of the boot-time policy pull (applied | none | error); rev = the policy.json "rev" it applied
        unique_id: doorbell_bk7258_policy
        icon: mdi:file-cog-outline
        state: "{{ trigger.event.data.policy if trigger.event.data.policy else this.state }}"
        attributes:
          rev: "{{ trigger.event.data.policy_rev if trigger.event.data.policy else this.attributes.get('rev') }}"
          sleep_min: "{{ trigger.event.data.sleep_min }}"
          wake_pir: "{{ trigger.event.data.wake_pir }}"
      - name: Doorbell BK7258 SD card
        # fw 0.28.1: "sd" in every report: ok | nocard (detect switch open) | fail (last mount/save failed) | off
        unique_id: doorbell_bk7258_sd
        icon: mdi:micro-sd
        state: "{{ trigger.event.data.sd if trigger.event.data.sd else this.state }}"
    binary_sensor:
      - name: Doorbell BK7258 USB power
        unique_id: doorbell_bk7258_usb
        device_class: plug
        state: "{{ (trigger.event.data.usb | int(0)) == 1 if trigger.event.data.usb is not none else this.state == 'on' }}"
      - name: Doorbell BK7258 charging
        unique_id: doorbell_bk7258_charging
        device_class: battery_charging
        state: "{{ (trigger.event.data.charging | int(0)) == 1 if trigger.event.data.charging is not none else this.state == 'on' }}"

automation:
  - id: doorbell_bk7258_low_battery
    alias: "Doorbell BK7258: low battery"
    triggers:
      - trigger: numeric_state
        entity_id: sensor.doorbell_bk7258_battery
        below: 15
        for: "00:10:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.doorbell_bk7258_usb_power
        state: "off"
    actions:
      - action: notify.doorbell_family
        data:
          title: Doorbell
          message: "Doorbell battery {{ states('sensor.doorbell_bk7258_battery') }} % - charge it"
    mode: single

  # fw 0.28.1: one push when the card goes missing or stops working (entity id from the sensor's name)
  - id: doorbell_bk7258_sd_problem
    alias: "Doorbell BK7258: microSD problem"
    triggers:
      - trigger: state
        entity_id: sensor.doorbell_bk7258_sd_card
        to: [nocard, fail]
    actions:
      - action: notify.doorbell_family
        data:
          title: Doorbell
          message: >-
            {{ 'The doorbell no longer sees its microSD card.' if trigger.to_state.state == 'nocard' else
               'The doorbell cannot write to its microSD card (loose contact or a damaged card).' }}
            Snapshots still go to Home Assistant.
    mode: single

  # fw 0.25: the seven helpers -> /config/www/doorbell/policy.json (the device fetches it on every boot), then try
  # to apply at once in case the device is awake (`pwr policy pull` over GET /cmd; a sleeping device just fails here).
  - id: doorbell_bk7258_policy
    alias: "Doorbell BK7258: policy file from the helpers"
    description: "Rewrites /config/www/doorbell/policy.json (rev = timestamp) whenever a doorbell setting helper changes and asks an awake device to pull it."
    triggers:
      - trigger: state
        entity_id:
          - input_number.doorbell_volume
          - input_select.doorbell_pir_sens
          - input_boolean.doorbell_pir_wake
          - input_number.doorbell_day_interval
          - input_number.doorbell_night_interval
          - input_number.doorbell_dark_mv
          - input_boolean.doorbell_night_light
        not_to: [unknown, unavailable]
    actions:
      - action: shell_command.doorbell_policy_write
      - action: rest_command.doorbell_cmd
        data:
          cmd: "pwr policy pull"
        continue_on_error: true
    mode: queued
    max: 3

# ---- talk (fw 0.23.0): speaker via the device's HTTP /speak, TTS through HA ----
rest_command:
  doorbell_speak_url:
    # the device pulls the WAV itself and replies after playback: allow the clip length
    url: "http://<device-ip>:8080/speak?url={{ url | urlencode }}"
    method: get
    timeout: 60
  doorbell_tone:
    url: "http://<device-ip>:8080/speak?tone={{ hz | default(1000) }}&ms={{ ms | default(500) }}"
    method: get
    timeout: 20
  # fw 0.25: any shell command while the device is awake (GET /cmd, token-protected). The URL carries the TCP
  # token, so it lives in secrets.yaml (chmod 600):
  #   doorbell_cmd_url: "http://<device-ip>:8080/cmd?t=<tcp-token>&c={{ cmd | urlencode }}"
  # Use: action rest_command.doorbell_cmd, data: {cmd: "vol 60"}; the reply text comes back in response_variable.
  doorbell_cmd:
    url: !secret doorbell_cmd_url
    method: get
    timeout: 5

shell_command:
  # message -> TTS mp3 (HA's own TTS API) -> 16 kHz mono WAV in /config/www/doorbell/<name>.wav
  doorbell_tts_wav: >-
    python3 /config/doorbell_tts_wav.py "{{ message }}" "{{ lang | default('en') }}" "{{ name | default('say') }}"
  # fw 0.25: helper states -> /config/www/doorbell/policy.json (doorbell_policy.py, rev = write time)
  doorbell_policy_write: >-
    python3 /config/doorbell_policy.py "{{ states('input_number.doorbell_volume') }}" "{{ states('input_select.doorbell_pir_sens') }}"
    "{{ states('input_boolean.doorbell_pir_wake') }}" "{{ states('input_number.doorbell_day_interval') }}"
    "{{ states('input_number.doorbell_night_interval') }}" "{{ states('input_number.doorbell_dark_mv') }}"
    "{{ states('input_boolean.doorbell_night_light') }}"

script:
  doorbell_say:
    alias: "Doorbell: say (TTS through the doorbell speaker)"
    mode: queued
    fields:
      message: {description: "Text to speak", example: "Please leave the parcel at the door", required: true}
      lang: {description: "TTS language", example: "nl", default: "en"}
    sequence:
      - action: shell_command.doorbell_tts_wav
        data: {message: "{{ message }}", lang: "{{ lang | default('en') }}", name: "say"}
      - action: rest_command.doorbell_speak_url
        data: {url: "http://<ha-ip>:8123/local/doorbell/say.wav"}

  doorbell_play:
    alias: "Doorbell: play a prerecorded WAV"
    fields:
      file: {description: "file name under /config/www/doorbell/", example: "leave_parcel.wav", required: true}
    sequence:
      - action: rest_command.doorbell_speak_url
        data: {url: "http://<ha-ip>:8123/local/doorbell/{{ file }}"}
